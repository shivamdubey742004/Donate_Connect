<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NGO Dashboard - DonateConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>


<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <span class="navbar-brand fw-bold">
            NGO Dashboard
        </span>

        <a href="index.html"
           class="btn btn-light">
            Logout
        </a>

    </div>

</nav>


<section class="py-5 bg-light">

    <div class="container">

        <h2 class="fw-bold">
            Helping Hands NGO
        </h2>

        <p class="text-muted">
            NGO Dashboard
        </p>


        <!-- STATS -->

        <div class="row mt-4">

            <div class="col-md-4 mb-3">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <h6>Total Donations</h6>

                        <h2 class="text-primary">
                            ₹25,000
                        </h2>

                    </div>

                </div>

            </div>


            <div class="col-md-4 mb-3">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <h6>Delivered</h6>

                        <h2 class="text-success">
                            18
                        </h2>

                    </div>

                </div>

            </div>


            <div class="col-md-4 mb-3">

                <div class="card shadow-sm border-0">

                    <div class="card-body">

                        <h6>Pending</h6>

                        <h2 class="text-warning">
                            4
                        </h2>

                    </div>

                </div>

            </div>

        </div>


        <!-- DONATIONS -->

        <div class="card shadow border-0 mt-4">

            <div class="card-body">

                <h4 class="fw-bold">
                    Recent Donations
                </h4>

                <div class="table-responsive mt-3">

                    <table class="table">

                        <thead>

                            <tr>

                                <th>ID</th>
                                <th>Amount</th>
                                <th>Purpose</th>
                                <th>Status</th>
                                <th>Action</th>

                            </tr>

                        </thead>


                        <tbody>

                            <tr>

                                <td>DC1025</td>

                                <td>₹2,000</td>

                                <td>Food</td>

                                <td>
                                    <span class="badge bg-warning text-dark">
                                        Pending Proof
                                    </span>
                                </td>

                                <td>

                                    <a href="donation-proof.html"
                                       class="btn btn-sm btn-primary">
                                        Update

                                    </a>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</section>


<footer class="bg-dark text-white text-center py-4">

    <p>
        DonateConnect | Shivam & Divayansh
    </p>

</footer>


</body>
</html>
