<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Donation - DonateConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>


<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            DonateConnect
        </a>

        <a href="donate.html" class="btn btn-warning">
            Donate
        </a>

    </div>

</nav>


<section class="py-5 bg-light">

    <div class="container">

        <div class="text-center mb-5">

            <h1 class="fw-bold">
                Track Your Donation
            </h1>

            <p class="text-muted">
                Enter your donation ID to see its complete journey.
            </p>

        </div>


        <div class="row justify-content-center">

            <div class="col-lg-6">

                <div class="card shadow border-0">

                    <div class="card-body p-4">

                        <label class="form-label">
                            Donation ID
                        </label>

                        <input type="text"
                               class="form-control"
                               placeholder="Example: DC1025">

                        <button class="btn btn-primary w-100 mt-3">
                            Track Donation
                        </button>

                    </div>

                </div>

            </div>

        </div>


        <!-- DEMO TRACKING RESULT -->

        <div class="card shadow border-0 mt-5">

            <div class="card-header bg-primary text-white">

                Donation #DC1025

            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-3 text-center">

                        <h1>💝</h1>

                        <h5>Donated</h5>

                        <p>₹2,000</p>

                    </div>


                    <div class="col-md-3 text-center">

                        <h1>🏢</h1>

                        <h5>NGO Received</h5>

                        <p>Helping Hands NGO</p>

                    </div>


                    <div class="col-md-3 text-center">

                        <h1>🤝</h1>

                        <h5>Delivered</h5>

                        <p>Greater Noida</p>

                    </div>


                    <div class="col-md-3 text-center">

                        <h1>📸</h1>

                        <h5>Proof</h5>

                        <a href="donation-proof.html"
                           class="btn btn-outline-primary">
                            View Proof
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<footer class="bg-dark text-white text-center py-4">

    <p>
        Created by <strong>Shivam & Divayansh</strong>
    </p>

</footer>


</body>
</html>
